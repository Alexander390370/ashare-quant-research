# 筛选层配置
#
# 这个文件是筛选层的「唯一真源」——所有阈值都在这里，改这里不改代码。
# 每次运行会把这个文件的内容一起存进审计日志，保证可追溯。

# ---------------------------------------------------------------------------
# 候选池定义
# ---------------------------------------------------------------------------
universe:
  # 用哪些指数的成分股作为候选池
  # 中证指数官网数据，实测 100% 稳定，且自带日期（天然 point-in-time）
  indices:
    - code: "000300"
      name: "沪深300"
    - code: "000905"
      name: "中证500"
  # 是否去重（同一只股票可能在多个指数里）
  deduplicate: true

# ---------------------------------------------------------------------------
# 硬性过滤规则
#
# 原则：只做「排除」，不做「排序」。
# 每条规则独立可开关，输出时统计每条排除了多少只。
# ---------------------------------------------------------------------------
filters:
  # ① 排除 ST / *ST / 退市风险股
  exclude_st:
    enabled: true
    # 股票名称包含以下任一关键字即排除
    keywords:
      - "ST"
      - "*ST"
      - "退"
      - "PT"

  # ② 排除上市不足 N 个月的次新股
  # 用腾讯日线的最早日期近似上市日（精确值需另找源）
  min_listing_months:
    enabled: true
    months: 12
    # 回看多少年日线来判定「最早日期」
    lookback_years: 3

  # ③ 排除流动性不足（日均成交额太低）
  min_avg_amount:
    enabled: true
    # 近 N 个交易日的日均成交额下限（元）
    # 5000 万 = 5e7
    min_amount_yuan: 50000000
    lookback_days: 20

  # ④ 排除停牌 / 长期无成交
  exclude_suspended:
    enabled: true
    # 最近 N 个交易日内完全没有成交，视为停牌
    no_trade_days: 5

# ---------------------------------------------------------------------------
# 数据源配置（实测结果，见 tools/stress_data_sources.py）
# ---------------------------------------------------------------------------
data_sources:
  # 指数成分股：中证官网，8/8 成功
  index_constituents: "csindex"
  # 日线：腾讯 8/8 成功；东财 0/8 不可用，不要用
  daily_prices: "tencent"
  # 复权方式：qfq=前复权（推荐）/ hfq=后复权 / ""=不复权
  #
  # 必须用前复权。实测（2026-10-30）复权前后首价差异：
  #   贵州茅台 -5.8%、工商银行 -9.6%、平安银行 -10.1%、比亚迪 -67.2%
  # 不复权数据在除权日跳空，会污染动量因子，且错误是静默的。
  adjust: "qfq"
  # 股票名称（判 ST）：交易所列表，7/8 成功，需重试
  stock_names: "exchange"
  # 重试参数
  retries: 3
  retry_backoff_seconds: 1.5
  # 提交节流间隔（并发模式下是「每提交一只等多久」，不是每次请求后等）
  request_interval_seconds: 0.05
  # 并发数。实测（2026-10-30，20 只样本）：
  #   并发 1  -> 94.9s，成功 55%
  #   并发 5  -> 23.7s，成功 100%
  #   并发 10 -> 19.4s，成功 100%   ← 默认值，快 6 倍且更稳
  #   并发 20 -> 14.2s，成功 100%
  workers: 10

# ---------------------------------------------------------------------------
# 输出配置
# ---------------------------------------------------------------------------
output:
  # 输出目录（相对项目根）
  dir: "screening/output"
  # 是否输出被剔除股票的明细（用于审计和影子组合）
  include_rejected: true
  # CSV 编码
  encoding: "utf-8-sig"
